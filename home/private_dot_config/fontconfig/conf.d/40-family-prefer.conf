<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ============================================================
     文件: 40-family-prefer.conf
     功能: 通用字体族的首选字体列表

     说明:
       - 使用 binding="same"。系统 66-noto-*.conf 等使用默认的
         weak 绑定，因此本列表会排在它们的默认项之前。
       - 列表允许包含尚未安装的字体：它们只会作为未来的
         回退项，不会产生错误。
       - 每个通用族按“西文优先、中文回退”的顺序排列，
         这样混排文本可分别使用最合适的字形。
     ============================================================ -->
<fontconfig>
  <description>设置 serif/sans-serif/monospace 等通用族的首选字体</description>

  <!-- Serif -->
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif</family>
      <family>Roboto Slab</family>
    </prefer>
  </alias>

  <!-- Sans-serif：核心西文 → 中文 → 备用西文 -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <!-- 核心现代字体 -->
      <family>Google Sans Display Medium</family>
      <family>Geist Medium</family>
      <family>CNN Sans</family>
      <family>Inter</family>
      <family>Helvetica Neue</family>
      <family>Roboto</family>

      <!-- 中文字体 -->
      <family>Noto Sans CJK SC</family>
      <family>GWM Sans UI</family>
      <family>LXGW Neo XiHei Screen</family>
      <family>MiSans</family>
      <family>阿里巴巴普惠体 3.0</family>

      <!-- 备用西文字体 -->
      <family>IBM Plex Sans</family>
      <family>Ubuntu</family>
      <family>Rubik</family>
      <family>Public Sans</family>
    </prefer>
  </alias>

  <!-- Monospace：编程字体 → 中文等宽 → 经典等宽 -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <!-- 现代编程字体 -->
      <family>GeistMono NFM Medium</family>
      <family>GoogleSansCode NFP Medium</family>
      <family>BlexMono Nerd Font Medium</family>
      <family>Ioskeley Mono Medium</family>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>FiraCode Nerd Font Mono</family>
      <family>CaskaydiaCove NFM</family>

      <!-- 中文等宽字体 -->
      <family>Noto Sans Mono CJK SC</family>
      <family>LXGW Neo XiHei Screen</family>
      <family>Maple Mono SC NF</family>

      <!-- 经典等宽字体 -->
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>

  <!-- Fantasy -->
  <alias>
    <family>fantasy</family>
    <prefer>
      <family>Impact</family>
      <family>Copperplate Gothic Std</family>
    </prefer>
  </alias>

  <!-- Cursive -->
  <alias>
    <family>cursive</family>
    <prefer>
      <family>Comic Sans MS</family>
      <family>Zapfino</family>
    </prefer>
  </alias>
</fontconfig>
