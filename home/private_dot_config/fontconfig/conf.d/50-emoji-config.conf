<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ============================================================
     文件: 50-emoji-config.conf
     功能: Emoji 字体族定义与通用族回退

     说明:
       - Emoji 是否为彩色由字体自身元数据决定，不再使用
         target="scan" 强制设置 color，避免把黑白 Emoji
         字体（如 Noto Emoji）错误标记为彩色。
       - <default> 会把 Emoji 放在通用族列表末尾，作为
         最后回退，不影响正常字体优先级。
     ============================================================ -->
<fontconfig>
  <description>Emoji 字体族与通用字体族回退</description>

  <!-- Emoji 字体族优先级 -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Blobmoji</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <!-- 为通用字体族追加 Emoji 作为最终回退 -->
  <alias>
    <family>sans-serif</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>monospace</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
</fontconfig>
