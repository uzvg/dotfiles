<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ============================================================
文件: 50-emoji-config.conf
功能: Emoji 和特殊符号字体配置
============================================================ -->
<fontconfig>
  <!-- Emoji 字体族定义 -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Blobmoji</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>
  <!-- 为所有通用字体族添加 Emoji 作为最终回退 (使用 default 而非 append 避免干扰优先顺序) -->
  <alias>
    <family>sans-serif</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>monospace</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <!-- 强制 Emoji 使用彩色渲染 -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>Emoji</string>
    </test>
    <edit name="color" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
