<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ============================================================
     文件: 10-font-aliases.conf
     功能: 字体名称标准化与别名映射

     说明:
       - 中文别名直接指向系统中实际安装的 Noto CJK 字体，
         避免映射到不存在的“宋体/黑体”后回退到西文字体。
       - 中文别名使用 <prefer>，保留原始名称作为后备；
         Helvetica 则必须用 assign 替换，否则会被系统
         30-metric-aliases.conf 抢先匹配到 Nimbus Sans。
     ============================================================ -->
<fontconfig>
  <description>字体名称标准化与别名映射</description>

  <!-- 宋体：繁体、简体、拼音写法 -->
  <alias binding="same">
    <family>宋體</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>SongTi</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>

  <!-- 黑体：繁体、简体、拼音写法 -->
  <alias binding="same">
    <family>黑體</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>HeiTi</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <!-- 常见西文字体别名 -->
  <!-- Helvetica 使用 assign 替换：若保留原名，系统的
       30-metric-aliases 会先匹配到 Nimbus Sans。 -->
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Helvetica Neue</string>
    </edit>
  </match>
</fontconfig>
