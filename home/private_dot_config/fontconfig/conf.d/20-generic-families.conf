<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ============================================================
     文件: 20-generic-families.conf
     功能: 为常见具体字体追加通用字体族

     说明:
       - 这里使用 mode="append" + binding="same"，把通用族
         作为强回退追加到具体字体之后。
       - 不要改成 <default>：系统 30-metric-aliases.conf 会先
         选中 metric 兼容字体（例如 Arial → Liberation Sans），
         从而绕过 40-family-prefer.conf 中自定义的 sans-serif
         首选列表。
       - 系统中已有同名映射的条目仍然保留，用于覆盖上述行为。
       - SFMono-Regular 会被 fontconfig 解析为 SFMono，并由
         系统 48-guessfamily.conf 自动追加 monospace，故不在此
         重复配置。
     ============================================================ -->
<fontconfig>
  <description>为具体字体追加通用字体族，保证回退到自定义首选列表</description>

  <!-- Serif -->
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="append" binding="same">
      <string>serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Bitstream Vera Serif</string></test>
    <edit name="family" mode="append" binding="same">
      <string>serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="append" binding="same">
      <string>serif</string>
    </edit>
  </match>

  <!-- Sans-serif -->
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="append" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="append" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="append" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- Monospace -->
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="append" binding="same">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Consolas</string></test>
    <edit name="family" mode="append" binding="same">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="append" binding="same">
      <string>monospace</string>
    </edit>
  </match>
</fontconfig>
