<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ============================================================
     文件: 60-rendering-options.conf
     功能: 字体渲染质量优化

     说明:
       - 全局值与系统默认基本一致，保留是为了让配置自包含。
       - subpixel 渲染（rgba）和 LCD 滤镜（lcdfilter）交给
         桌面环境（Xft / Wayland 合成器）管理，此处不覆盖。
       - 规则顺序很重要：特定字体规则在前，字号覆盖在后，
         这样“小字号使用 hintfull”才能真正生效。
     ============================================================ -->
<fontconfig>
  <description>字体渲染参数与特定字体优化</description>

  <!-- 全局渲染设置 -->
  <match target="font">
    <!-- 抗锯齿 -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <!-- 微调 (hinting) -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <!-- 微调风格: slight 适合现代字体 -->
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>

  <!-- 特定字体优化 -->
  <!-- Noto 系列：保留字体自带 hinting -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Noto</string>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- 等宽/编程字体：完整 hinting 更清晰 -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Mono</string>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
  </match>

  <!-- 小字号优化（< 12px）：放在最后，覆盖上面的字体规则 -->
  <match target="font">
    <test name="pixelsize" compare="less">
      <double>12</double>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
  </match>

  <!-- 禁用嵌入点阵字体，统一使用轮廓渲染 -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
</fontconfig>
