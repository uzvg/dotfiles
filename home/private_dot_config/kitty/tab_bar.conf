# ———————————————————————————————————————————————————————————————————
# General settings
# ———————————————————————————————————————————————————————————————————
# 🔗 https://sw.kovidgoyal.net/kitty/conf/#tab-bar

# 标签栏位置：top / bottom / left / right（默认 bottom）
# tab_bar_edge top

# 至少打开 2 个标签才显示标签栏
tab_bar_min_tabs 2

# 标签栏垂直于边缘的留白：
#   top/bottom 时为左右留白；left/right 时为上下留白
tab_bar_margin_width 0.0

# 标签栏沿边缘方向的留白：<距窗口边缘> <距终端内容区>
tab_bar_margin_height 10 0

# 标签栏样式：fade / slant / separator / powerline / custom / hidden
# powerline 模式下的分隔符形状：angled / slanted / round
tab_bar_style powerline
tab_powerline_style angled

# 后台标签有活动时显示的标记（会占用标题宽度）
tab_activity_symbol "🕭 "

# ———————————————————————————————————————————————————————————————————
# Title template
# ———————————————————————————————————————————————————————————————————
# 标题最大宽度（单元格）；0 表示不限制。模板会据此自适应截断，
# 若仍有超出，kitty 会再用 … 截断一次。
tab_title_max_length 20

# 模板按 Python f-string 求值。常用字段：
#   index / title / tab.active_wd / max_title_length / num_windows / layout_name
# 常用格式：
#   索引色：{fmt.fg.color11} … {fmt.fg.default}
#   加粗：  {fmt.bold} … {fmt.nobold}
#   背景色：{fmt.bg.red} … {fmt.bg.default}
# 完整示例：{fmt.bg.red}{fmt.fg.white} ⊚ {fmt.fg.default}{fmt.bg.default}
#
# 若模板未包含 bell_symbol / activity_symbol / secure_input_symbol，
# kitty 会自动把它们加到标题前，因此实际可用宽度会略小于 max_title_length。
#
# 显示“索引:当前工作目录”；放不下时保留路径末尾（信息量最大），
# 优先在 / 处断开，例如 …/wikis/WikiSpace。
# 注：按字符数估算宽度，目录名含中文等全角字符时，最终可能由 kitty 再截断一次。
tab_title_template "{index}:{(lambda p, n: p if len(p) <= n else ('…/' + t.split('/', 1)[-1] if '/' in (t := p[1 - n:]) else '…' + t) if n > 2 else '…')((tab.active_wd or title).replace('/home/uzvg', '~', 1), max_title_length - len(str(index)) - 1)}"

# 活动标签加粗、非活动标签斜体；颜色由 current-theme.conf 提供
active_tab_font_style   bold
inactive_tab_font_style italic
