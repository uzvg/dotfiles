# ———————————————————————————————————————————————————————————————————
# General settings
# ———————————————————————————————————————————————————————————————————
# 🔗 https://sw.kovidgoyal.net/kitty/conf/#tab-bar
tab_bar_min_tabs 2
tab_title_max_length 20
# tab_bar_edge top
tab_bar_margin_width 0.0
# 控制标签栏与窗口顶部/底部边缘之间的距离 / 标签栏与终端文字内容区域之间的距离
tab_bar_margin_height 10 0

# kitty tab bar style: fade slant separator powerline custom hidden
tab_bar_style powerline
tab_powerline_style round
tab_activity_symbol "🕭 "

# ———————————————————————————————————————————————————————————————————
# title template
# ———————————————————————————————————————————————————————————————————
# 使用索引色(0~255)
# {fmt.fg.color11}⊚ {fmt.fg.default}
# 加粗
# {fmt.bold}{fmt.nobold}
# 修改背景色
# {fmt.bg.red}{fmt.bg.default}

# 完整示例
# {fmt.bg.red}{fmt.fg.white} ⊚ {fmt.fg.default}{fmt.bg.default}

tab_title_template "{index}:{title}"
# active_tab_title_template "{index}:{title}"
active_tab_title_template "⊚ {index}:{title}"

active_tab_font_style   bold
inactive_tab_font_style italic

# ———————————————————————————————————————————————————————————————————
# Github Dark Theme
# ———————————————————————————————————————————————————————————————————
# 活动标签 (Active Tab) - 使用 GitHub 标志性的绿色
# active_tab_foreground   #ffffff
# active_tab_background   #238636
#
# 非活动标签 (Inactive Tab) - 使用 GitHub 的深蓝背景色
# inactive_tab_foreground #8b949e
# inactive_tab_background #161b22
#
# 标签栏背景 - 保持暗色，突出彩色的标签
#   一般不设置，使其跟原背景色保持一致
# tab_bar_background      #0d1117
#
# active_border_color   #238636
# inactive_border_color #161b22

# ———————————————————————————————————————————————————————————————————
# Ayu Dark theme
# ———————————————————————————————————————————————————————————————————
background #0B0E14
# active_tab_foreground   #24272D
# active_tab_background   #AAD84C
#
# inactive_tab_foreground #eeeeee
# inactive_tab_background #24272D

# active_border_color   #AAD84C
# inactive_border_color #24272D

# ———————————————————————————————————————————————————————————————————
# Cherry Midnight theme
# ———————————————————————————————————————————————————————————————————
active_tab_foreground   #33333f
active_tab_background   #64de83

inactive_tab_foreground #dedeff
inactive_tab_background #43435a

active_border_color   #64de83
inactive_border_color #43435a
