# ———————————————————————————————————————————————————————————————————
# 字体设置 (Fonts)
# ———————————————————————————————————————————————————————————————————
# 可以使用 'kitty +list-fonts' 查看系统可用字体
font_family      family="monospace"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
# 字距看起来比较稀疏时开启
# modify_font column_width -2px
# Keep ligatures enabled for programming fonts
disable_ligatures never

# 符号映射（解决一些特殊图标显示过小的问题）
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+E100-U+E161,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E62B,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F31C,U+F400-U+F4A3,U+F500-U+F8FF,U+FB00-U+FB06,U+FEFF Symbols Nerd Font

# ———————————————————————————————————————————————————————————————————
# 窗口布局与 Wayland 特性 (Window & Wayland)
# ———————————————————————————————————————————————————————————————————
# 强制使用 Wayland 协议（防止在某些环境下回退到 XWayland）
linux_display_server wayland

# 窗口装饰（标题栏）
hide_window_decorations yes

# 窗口内边距（让文字不紧贴边缘，视觉更舒适）
window_padding_width 10
window_border_width 1pt
draw_minimal_borders yes

# 记住窗口大小
remember_window_size  no
initial_window_width  135c
initial_window_height 35c

# ———————————————————————————————————————————————————————————————————
# 透明度与背景 (Appearance)
# ———————————————————————————————————————————————————————————————————
# 背景透明度 (0.0 - 1.0)
background_opacity80.95

# 模糊设置 (仅限部分支持控制透明模糊的 Wayland 合成器，如 Hyprland)
background_blur 1

# 透明度是否应用到动态背景（如果你使用图片背景的话）
# dynamic_background_opacity yes

# ———————————————————————————————————————————————————————————————————
# 光标与鼠标 (Cursor & Mouse)
# ———————————————————————————————————————————————————————————————————
# 光标形状: block, beam, underline
cursor_shape underline
# 光标拖尾，越大拖尾越长
cursor_trail 3
cursor_trail_decay 0.1 0.3
# 光标闪烁
cursor_blink_interval 0.4
# 当切换到其他窗口再切回来时，光标是否继续闪烁
shell_integration enabled
# 光标隐藏延迟（秒）
mouse_hide_wait 3.0

# ———————————————————————————————————————————————————————————————————
# URL HANDLING
# ———————————————————————————————————————————————————————————————————
# Underline URLs with curly style
url_style curly
# Open URLs with default system browser
open_url_with default
# Recognize these URL schemes
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
# Enable automatic URL detection
detect_urls yes
# Allow clickable hyperlinks
allow_hyperlinks yes

# ———————————————————————————————————————————————————————————————————
# 性能与兼容性 (Performance & Advanced)
# ———————————————————————————————————————————————————————————————————
# 帧率限制（匹配你的显示器刷新率，Wayland 下通常会自动同步）
# repaint_delay = 1000 / refresh_rate, just keep default
# repaint_delay 7
# 在按键输入后，Kitty 等待多久才处理输入事件，单位毫秒，为了合帧
# input_delay 3
sync_to_monitor yes
# 复制到剪贴板
copy_on_select yes
# 终端铃声（关闭它，非常烦人）
enable_audio_bell no

# ———————————————————————————————————————————————————————————————————
# TILING LAYOUTS
# ———————————————————————————————————————————————————————————————————
# Enable multiple tiling layouts for cycling and advanced window management
enabled_layouts splits, stack, tall, fat, grid, horizontal, vertical

# ———————————————————————————————————————————————————————————————————
# 模块化配置
# ———————————————————————————————————————————————————————————————————
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
# 快捷键配置
include keymaps.conf
# tab bar settings
include tab_bar.conf
